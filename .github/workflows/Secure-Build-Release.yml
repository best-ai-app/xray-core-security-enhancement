name: Secure Build and Release
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# 关键：必须赋予 Action 写入权限，否则无法免密自动创建 Release 页面
permissions:
  contents: write

jobs:
  secure-build:
    runs-on: ubuntu-latest
    strategy:
      # 防止某一个架构构建失败导致其他架构被强行终止
      fail-fast: false 
      matrix:
        include:
          - goos: linux
            goarch: amd64
            friendlyName: linux-x86-64
          - goos: linux
            goarch: arm64
            friendlyName: linux-arm64-v8a
    
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Get project dependencies
        run: go mod download

      - name: Build Xray with Maximum Security
        run: |
          mkdir -p build_assets
          COMMID=$(git describe --always --dirty 2>/dev/null || echo "unknown")


          echo "Building Xray for $GOOS/$GOARCH with full PIE..."
          
          # 不再妥协！x86-64 和 ARM64 统统开启 -buildmode=pie
          go build -o build_assets/xray \
            -trimpath \
            -buildmode=pie \
            -tags "netgo,osusergo" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -v ./main

      - name: Magic Patch for OpenWrt (ARM64)
        if: matrix.goarch == 'arm64'
        run: |
          echo "Patching ELF Interpreter for OpenWrt compatibility..."
          # 安装 ELF 头修补工具
          sudo apt-get update && sudo apt-get install -y patchelf
          
          # 将写死的 glibc 加载器无损替换为 OpenWrt 专属的 musl 加载器
          patchelf --set-interpreter /lib/ld-musl-aarch64.so.1 build_assets/xray
          echo "Patch complete. ASLR memory protection is now active for OpenWrt."
          
          echo "Building Xray for $GOOS/$GOARCH with max security features..."
          
          # 安全特性拉满：PIE机制 + 纯净依赖隔离 + 逆向指纹抹除
          go build -o build_assets/xray \
            -trimpath \
            -buildmode=pie \
            -tags "netgo,osusergo" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -v ./main

      - name: Download Geo Assets (IP & Site Databases)
        run: |
          echo "Downloading latest geoip and geosite data for standalone usage..."
          wget -qO build_assets/geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          wget -qO build_assets/geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat

      - name: Copy README & LICENSE
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md 2>/dev/null || true
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE 2>/dev/null || true

      - name: Create Immutable ZIP Archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          # 时间戳对齐，确保每次相同源码打出的 ZIP Hash 防护一致
          touch -mt $(date +%Y01010000) *
          zip -9vr ../Xray-${{ matrix.friendlyName }}.zip .
          popd || exit 1
          
          FILE=./Xray-${{ matrix.friendlyName }}.zip
          for METHOD in {"md5","sha1","sha256","sha512"}; do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$FILE.dgst
          done

      - name: Determine Release Tag and Name
        # 这个步骤智能判断：如果是官方发布，则使用官方Tag；如果是Push或手动触发，则自动生成唯一标识Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "TAG_NAME=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=${{ github.event.release.name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            # 使用 Commit 的前7位短哈希作为标识，保证 x86 和 arm64 矩阵任务产生绝对一致的 Tag 名字，以便合并到一个页面
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "TAG_NAME=autobuild-${SHORT_SHA}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Publish to Github Releases (Public Download)
        # 不再受限于 if: github.event_name == 'release'，每次构建都将推送至 Release 页面
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            ./Xray-${{ matrix.friendlyName }}.zip
            ./Xray-${{ matrix.friendlyName }}.zip.dgst
