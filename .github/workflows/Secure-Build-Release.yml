name: Secure Build and Release
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  secure-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            friendlyName: linux-x86-64
          - goos: linux
            goarch: arm64
            friendlyName: linux-arm64-v8a
    
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Get project dependencies
        run: go mod download

      - name: Build Xray with Maximum Security
        run: |
          mkdir -p build_assets
          COMMID=$(git describe --always --dirty 2>/dev/null || echo "unknown")
          
          echo "Building Xray for $GOOS/$GOARCH with max security features..."
          
          # 安全特性拉满的核心编译指令：
          # 1. -trimpath          : 抹除本地路径信息，防源码路径泄漏
          # 2. -buildmode=pie     : 启用 PIE，配合操作系统的 ASLR 防御 ROP 攻击
          # 3. -tags netgo...     : 强制纯净 Go 依赖，防 libc 投毒和劫持，完美适配 OpenWrt
          # 4. -ldflags "-s -w"   : 剥离符号表和调试信息，增加反编译与逆向难度
          # 5. -ldflags "-buildid=": 移除构建环境指纹，防环境溯源关联
          
          go build -o build_assets/xray \
            -trimpath \
            -buildmode=pie \
            -tags "netgo,osusergo" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -v ./main

      - name: Download Geo Assets (IP & Site Databases)
        run: |
          echo "Downloading latest geoip and geosite data for standalone usage..."
          wget -qO build_assets/geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          wget -qO build_assets/geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat

      - name: Copy README & LICENSE
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md 2>/dev/null || true
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE 2>/dev/null || true

      - name: Create Immutable ZIP Archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          # 将所有文件的时间戳抹平，确保每一次构建输出相同源码的 ZIP 哈希一致（防指纹溯源）
          touch -mt $(date +%Y01010000) *
          zip -9vr ../Xray-${{ matrix.friendlyName }}.zip .
          popd || exit 1
          
          # 生成所有安全特征值
          FILE=./Xray-${{ matrix.friendlyName }}.zip
          for METHOD in {"md5","sha1","sha256","sha512"}; do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$FILE.dgst
          done

      - name: Upload binaries to Github Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./Xray-${{ matrix.friendlyName }}.zip
            ./Xray-${{ matrix.friendlyName }}.zip.dgst

      - name: Upload binaries to Artifacts (for Push/PR checks)
        uses: actions/upload-artifact@v4
        with:
          name: Xray-${{ matrix.friendlyName }}-Artifact
          path: ./build_assets/*
