name: Secure Build and Release
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# 关键：必须赋予 Action 写入权限，否则无法免密自动创建 Release 页面
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  secure-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        include:
          # 1. 针对常规云服务器 (Debian/Ubuntu 等)，使用默认 glibc 加载器
          - goos: linux
            goarch: amd64
            friendlyName: linux-x86-64-standard
            patchMusl: false

          # 2. 针对 x86 软路由 (OpenWrt)，必须执行 patchelf 替换为 musl x86 加载器
          - goos: linux
            goarch: amd64
            friendlyName: linux-x86-64-openwrt
            patchMusl: true
            interpreter: /lib/ld-musl-x86_64.so.1
            
          # 3. 针对 ARM 软路由 (OpenWrt)，必须执行 patchelf 替换为 musl arm64 加载器
          - goos: linux
            goarch: arm64
            friendlyName: linux-arm64-v8a-openwrt
            patchMusl: true
            interpreter: /lib/ld-musl-aarch64.so.1
    
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Get project dependencies
        run: go mod download

      - name: Build Xray with Maximum Security
        run: |
          mkdir -p build_assets
          COMMID=$(git describe --always --dirty 2>/dev/null || echo "unknown")

          echo "Building Xray for $GOOS/$GOARCH with full PIE..."
          
          # 第一步：统一进行安全特性拉满的编译（生成初始 PIE 文件）
          go build -o build_assets/xray \
            -trimpath \
            -buildmode=pie \
            -tags "netgo,osusergo" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -v ./main

      - name: Magic Patch for OpenWrt (musl compatibility)
        # 只有矩阵参数 patchMusl 为 true 时才执行手术
        if: matrix.patchMusl
        run: |
          echo "Patching ELF Interpreter for OpenWrt (${{ matrix.friendlyName }})..."
          sudo apt-get update && sudo apt-get install -y patchelf
          # 根据矩阵自动注入正确的 musl 加载器路径
          patchelf --set-interpreter ${{ matrix.interpreter }} build_assets/xray
          echo "Patch complete. ASLR memory protection active for musl environment."
      - name: Download Geo Assets (IP & Site Databases)
        run: |
          echo "Downloading latest geoip and geosite data for standalone usage..."
          wget -qO build_assets/geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          wget -qO build_assets/geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat

      - name: Copy README & LICENSE
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md 2>/dev/null || true
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE 2>/dev/null || true

      - name: Create Immutable ZIP Archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          # 时间戳对齐，确保每次相同源码打出的 ZIP Hash 防护一致
          touch -mt $(date +%Y01010000) *
          zip -9vr ../Xray-${{ matrix.friendlyName }}.zip .
          popd || exit 1
          
          FILE=./Xray-${{ matrix.friendlyName }}.zip
          for METHOD in {"md5","sha1","sha256","sha512"}; do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$FILE.dgst
          done

      - name: Determine Release Tag and Name
        id: release_info
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "TAG_NAME=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=${{ github.event.release.name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "TAG_NAME=autobuild-${SHORT_SHA}" >> $GITHUB_ENV
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Publish to Github Releases via Native CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing assets to Release: ${{ env.TAG_NAME }}"
          
          # 1. 动态判断是否为预发布版本
          PRERELEASE_FLAG=""
          if [ "${{ env.IS_PRERELEASE }}" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          # 2. 并发安全地创建 Release 页面
          # 因为 x86 和 arm64 矩阵是并行执行的，使用 || true 确保即使其他架构已经抢先创建了页面，这里也不会报错中断
          gh release create "${{ env.TAG_NAME }}" --title "${{ env.RELEASE_NAME }}" $PRERELEASE_FLAG || true
          
          # 3. 强力上传当前架构的二进制压缩包和哈希文件
          # --clobber 允许覆盖，防止极小概率的网络重试冲突
          gh release upload "${{ env.TAG_NAME }}" \
            ./Xray-${{ matrix.friendlyName }}.zip \
            ./Xray-${{ matrix.friendlyName }}.zip.dgst \
            --clobber
    
